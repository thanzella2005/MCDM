ppercase;letter-spacing:.12em;color:var(--ink-2)}\np{margin:0 0 10px}\n.muted{color:var(--ink-2);font-size:15px}\n.story{max-width:64ch}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:15px}\nth,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}\nth{font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}\ntd.m,th.m{text-align:right}\ntd.m{font-family:var(--font-mono)}\ntd b.j{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--ink);color:var(--bg);font:700 16px var(--font-display);margin-right:8px;border-radius:2px}\n.rules{margin:10px 0 14px;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}\n.rules li{padding-left:16px;position:relative}\n.rules li::before{content:\"\";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--yellow);border:1px solid var(--ink)}\n.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 14px}\n.fld{display:grid;gap:4px;min-width:0}\n.fld span{font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}\ninput[type=text],input[type=number],textarea{width:100%;min-width:0;background:var(--bg);border:2px solid var(--ink);border-radius:2px;padding:9px 11px}\ntextarea{resize:vertical;min-height:92px;line-height:1.4}\n.btn{background:var(--panel);border:2px solid var(--ink);border-radius:2px;padding:9px 16px;font-weight:600;cursor:pointer}\n.btn:hover:not(:disabled){background:var(--panel-2)}\n.btn.go{background:var(--yellow);color:var(--yellow-ink);font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.08em;padding:10px 22px;box-shadow:0 3px 0 var(--ink)}\n.btn.go:hover:not(:disabled){background:var(--yellow);filter:brightness(1.06)}\n.btn.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.btn.sm{padding:4px 9px;font-size:14px}\n.link{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink-2);font-size:14px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.alarm-banner{background:var(--red);color:#fff;border:2px solid var(--ink);padding:14px 16px;margin-bottom:14px;border-radius:3px}\n.alarm-banner h2{color:#fff;margin:0 0 4px;font-size:30px}\n.alarm-banner p{margin:0}\n.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin:8px 0 12px}\n.card{display:grid;gap:1px;text-align:left;background:var(--panel);border:2px solid var(--ink);border-radius:2px;padding:8px 10px;cursor:pointer;min-width:0}\n.card:hover:not(:disabled){background:var(--panel-2)}\n.card:disabled{opacity:.35;cursor:not-allowed}\n.card .cl{font:800 30px/1 var(--font-display)}\n.card .cn{font-weight:600}\n.card .cm{font:500 13px var(--font-mono);color:var(--ink-2)}\n.queue{list-style:none;margin:8px 0 12px;padding:0;display:grid;gap:6px}\n.queue li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--line);padding:6px 8px;border-radius:2px}\n.queue .pos{font:600 13px var(--font-mono);color:var(--ink-2);min-width:2ch}\n.queue .nm b{font:800 20px var(--font-display);margin-right:8px}\n.queue .ops{display:flex;gap:4px}\n.empty{color:var(--ink-2);font-size:15px;padding:8px 0}\n/* timeline */\n.gwrap{background:var(--bg);border:1.5px solid var(--ink);border-radius:2px;padding:12px 14px 8px;margin:8px 0 12px}\n.lane{position:relative;height:58px;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100% / 14))}\n.blk{position:absolute;top:0;bottom:0;display:grid;place-items:center;background:var(--block);color:var(--on);box-shadow:inset -2px 0 0 var(--bg);overflow:hidden}\n.blk b{font:800 24px var(--font-display)}\n.blk.done{background:var(--done)}\n.blk.ok{background:var(--green)}\n.blk.late{background:repeating-linear-gradient(-45deg,var(--red) 0 7px,var(--red-2) 7px 14px)}\n.blk.fix{background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#121A1F 8px 16px);color:var(--yellow-ink)}\n.blk.fix span{background:var(--yellow);color:var(--yellow-ink);font:700 10px var(--font-mono);padding:1px 4px;letter-spacing:.04em}\n.axis,.dues{position:relative;height:22px}\n.axis span{position:absolute;top:4px;transform:translateX(-50%);font:500 11px var(--font-mono);color:var(--ink-2)}\n.dues{height:26px}\n.due{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:700 11px var(--font-mono);padding:0 5px;border-radius:2px}\n.due::before{content:\"\";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border:3px solid transparent;border-bottom-color:var(--ink);border-top:0}\n.gleg{font-size:13px;color:var(--ink-2);margin-top:4px}\n.sw{display:inline-block;width:10px;height:10px;margin:0 4px 0 8px;vertical-align:-1px;border:1px solid var(--ink)}\n.sw.ok{background:var(--green)} .sw.late{background:var(--red)} .sw.due{background:var(--ink)}\n.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 14px;margin:8px 0 12px}\n.fin label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}\n.fin label b{font:800 22px var(--font-display)}\n.stat-ok{color:var(--green);font-weight:600} .stat-late{color:var(--red);font-weight:600}\n.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}\n.pt{border:1.5px solid var(--ink);background:var(--bg);padding:8px 10px;display:grid;gap:2px}\n.pt b{font:600 24px var(--font-mono);font-variant-numeric:tabular-nums}\n.pt small{color:var(--ink-2);font-size:13px}\n.big{font:800 72px/1 var(--font-display);letter-spacing:.01em}\n.big small{font-size:30px;color:var(--ink-2)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.chip{font:700 18px var(--font-display);background:var(--ink);color:var(--bg);padding:2px 10px;border-radius:2px}\n.chip.fixc{background:var(--yellow);color:var(--yellow-ink);font-size:14px;font-family:var(--font-mono)}\n.sub{width:100%;min-height:210px;font:500 13px/1.45 var(--font-mono)}\n.foot{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;color:var(--ink-2);font-size:13px}\n.org textarea{min-height:160px;font:500 13px/1.4 var(--font-mono)}\n.verify-ok{color:var(--green);font-weight:600} .verify-bad{color:var(--red);font-weight:600}\ndetails summary{cursor:pointer;color:var(--ink-2);font-size:14px}\ndetails p{font-size:14px;margin:6px 0 0;max-width:70ch;white-space:normal}\ntd input.jm{width:70px;padding:4px 6px;text-align:right;font-family:var(--font-mono)}\n.err{color:var(--red);font-weight:600;font-size:14px}\n@media (max-width:480px){h1{font-size:44px}.lamp{min-width:0;flex:1}.andon{width:100%}}\nbody{margin:0}\n:root{color-scheme:light dark}\n.ps dl{display:grid;grid-template-columns:minmax(80px,110px) minmax(0,1fr);gap:8px 14px;margin:10px 0 0}.ps dt{font:700 14px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);padding-top:3px}.ps dd{margin:0;max-width:66ch}.ps h2{margin-top:2px}@media (max-width:480px){.ps dl{grid-template-columns:1fr;gap:2px}.ps dd{margin-bottom:8px}}\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n  <header class=\"head\">\n    <div>\n      <div class=\"eyebrow\">ABC Manufacturing \u00b7 Production Manager Challenge<\/div>\n      <h1>Machine Down<\/h1>\n    <\/div>\n    <ol class=\"andon\" id=\"andon\" aria-label=\"Round progress\"><\/ol>\n  <\/header>\n  <main id=\"screen\"><\/main>\n  <div class=\"foot\"><span>Built for the college fest pre-event. One attempt per participant.<\/span><\/div>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nvar $=function(s){return document.querySelector(s)};\nvar esc=function(s){return String(s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})};\n\n/* ---------- case data ---------- */\nvar J={A:{n:'Gear',p:3,d:6,pr:500},B:{n:'Shaft',p:2,d:4,pr:400},C:{n:'Bolt',p:1,d:8,pr:200},D:{n:'Bearing',p:4,d:7,pr:700},E:{n:'Pulley',p:2,d:5,pr:350}};\nvar L=['A','B','C','D','E'],REPAIR=2,HORIZON=14,MAX_ATTEMPTS=2,CFG=window.MD_CONFIG||{},SUBMIT_URL=String(CFG.submitUrl||'').trim(),KEY='machine-down-v1';\n\nfunction run(order,repair){\n  var t=0,rows=[],tard=0,on=0,profit=0,ontime=[];\n  order.forEach(function(j,i){\n    var s=t;t+=J[j].p;\n    var late=Math.max(0,t-J[j].d);\n    rows.push({j:j,s:s,f:t,late:late});\n    if(late===0){on++;profit+=J[j].pr;ontime.push(j)}\n    tard+=late;\n    if(i===0&&repair)t+=REPAIR;\n  });\n  return {rows:rows,on:on,tard:tard,profit:profit,ontime:ontime};\n}\n/* ---------- state ---------- */\nvar STAGES=['intro','r1','r1res','r2','r2res','r3','final'];\nfunction fresh(){return {stage:'intro',attempt:1,sent:'',name:'',roll:'',t0:0,t1:0,q1:[],f1:{},q2:[],f2:{},why:'',handle:'',impact:'',s1:null,s2:null}}\nfunction load(){\n  try{\n    var s=JSON.parse(localStorage.getItem(KEY));\n    if(s&&STAGES.indexOf(s.stage)>=0&&Array.isArray(s.q1)&&Array.isArray(s.q2)){\n      var f=fresh();for(var k in f)if(s[k]!==undefined)f[k]=s[k];\n      f.q1=f.q1.filter(function(j){return J[j]});f.q2=f.q2.filter(function(j){return J[j]});\n      return f;\n    }\n  }catch(e){}\n  return fresh();\n}\nvar S=load();\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nfunction fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}\nfunction num(x){var v=parseFloat(x);return isNaN(v)?null:v}\nfunction norm(s){return String(s||'').replace(/\\s+/g,' ').trim()}\nfunction oneLine(s){return norm(s)}\nfunction hash(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return ('0000000'+h.toString(36).toUpperCase()).slice(-7)}\n\n/* ---------- pieces ---------- */\nfunction andon(){\n  var st=STAGES.indexOf(S.stage),h='';\n  var defs=[['Plan',['r1','r1res']],['Breakdown',['r2','r2res']],['Decision',['r3']]];\n  defs.forEach(function(d,i){\n    var cl='lamp';\n    if(S.stage==='final')cl+=' done';\n    else if(d[1].indexOf(S.stage)>=0)cl+=i===1?' alarm':' on';\n    else if(st>STAGES.indexOf(d[1][d[1].length-1]))cl+=' done';\n    h+='<li class=\"'+cl+'\"><i><\/i>Round '+(i+1)+' \u00b7 '+d[0]+'<\/li>';\n  });\n  $('#andon').innerHTML=h;\n}\nfunction jobTable(){\n  return '<div class=\"tw\"><table><thead><tr><th>Job<\/th><th class=\"m\">Processing<\/th><th class=\"m\">Due<\/th><th class=\"m\">Profit<\/th><\/tr><\/thead><tbody>'+\n    L.map(function(j){return '<tr><td><b class=\"j\">'+j+'<\/b>'+J[j].n+'<\/td><td class=\"m\">'+J[j].p+' hr<\/td><td class=\"m\">'+J[j].d+' hr<\/td><td class=\"m\">\u20b9'+J[j].pr+'<\/td><\/tr>'}).join('')+'<\/tbody><\/table><\/div>';\n}\nfunction gantt(rows,o){\n  var H=HORIZON,h='<div class=\"gwrap\"><div class=\"lane\">';\n  rows.forEach(function(r,i){\n    var cl='blk';\n    if(o.reveal)cl+=r.late?' late':' ok';else if(o.done0&&i===0)cl+=' done';\n    h+='<div class=\"'+cl+'\" style=\"left:'+(r.s/H*100)+'%;width:'+((r.f-r.s)/H*100)+'%\"><b>'+r.j+'<\/b><\/div>';\n  });\n  if(o.repair&&rows.length){h+='<div class=\"blk fix\" style=\"left:'+(rows[0].f/H*100)+'%;width:'+(REPAIR/H*100)+'%\"><span>REPAIR<\/span><\/div>'}\n  h+='<\/div>';\n  if(o.reveal){\n    h+='<div class=\"axis\" aria-hidden=\"true\">';for(var i=0;i<=H;i++)h+='<span style=\"left:'+(i/H*100)+'%\">'+i+'<\/span>';h+='<\/div>';\n    h+='<div class=\"dues\" aria-hidden=\"true\">';rows.forEach(function(r){h+='<span class=\"due\" style=\"left:'+(J[r.j].d/H*100)+'%\">'+r.j+'<\/span>'});h+='<\/div>';\n    h+='<div class=\"gleg\">Hours on the axis. <span class=\"sw ok\"><\/span>On time <span class=\"sw late\"><\/span>Late <span class=\"sw due\"><\/span>Tag under the axis marks that job\u2019s due hour<\/div>';\n  } else h+='<div class=\"gleg\">Preview to scale. Each grid line is one hour. Work out the finish times yourself below.<\/div>';\n  return h+'<\/div>';\n}\nfunction jobCard(j,dis){return '<button class=\"card\" data-act=\"add\" data-j=\"'+j+'\"'+(dis?' disabled':'')+' aria-label=\"Add job '+j+', '+J[j].n+'\"><span class=\"cl\">'+j+'<\/span><span class=\"cn\">'+J[j].n+'<\/span><span class=\"cm\">'+J[j].p+' h \u00b7 due '+J[j].d+' \u00b7 \u20b9'+J[j].pr+'<\/span><\/button>'}\nfunction queueHTML(q,startPos){\n  if(!q.length)return '<div class=\"empty\">Nothing queued yet. Tap a job card to add it.<\/div>';\n  return '<ol class=\"queue\">'+q.map(function(j,i){\n    return '<li><span class=\"pos\">'+(i+startPos)+'<\/span><span class=\"nm\"><b>'+j+'<\/b>'+J[j].n+' <span class=\"muted\">('+J[j].p+' h)<\/span><\/span><span class=\"ops\">'+\n      '<button class=\"btn sm\" data-act=\"up\" data-i=\"'+i+'\" aria-label=\"Move '+j+' earlier\"'+(i===0?' disabled':'')+'>\u25b2<\/button>'+\n      '<button class=\"btn sm\" data-act=\"down\" data-i=\"'+i+'\" aria-label=\"Move '+j+' later\"'+(i===q.length-1?' disabled':'')+'>\u25bc<\/button>'+\n      '<button class=\"btn sm\" data-act=\"rm\" data-i=\"'+i+'\" aria-label=\"Remove '+j+'\">\u2715<\/button><\/span><\/li>';\n  }).join('')+'<\/ol>';\n}\nfunction finInputs(q,store,fromHint){\n  if(!q.length)return '';\n  return '<h3>Your calculation<\/h3><p class=\"muted\">'+fromHint+'<\/p><div class=\"fin\">'+q.map(function(j){\n    return '<label><b>'+j+'<\/b><span class=\"fld\" style=\"gap:0\"><input type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"40\" step=\"1\" id=\"f-'+j+'\" value=\"'+esc(store[j]===undefined?'':store[j])+'\" aria-label=\"Finish hour of job '+j+'\" placeholder=\"Finishes at hour\"><\/span><\/label>';\n  }).join('')+'<\/div>';\n}\n\n/* ---------- screens ---------- */\nfunction introHTML(){\n  return '<div class=\"panel ps\"><div class=\"label\">Problem statement \\u00B7 Industrial Engineering \\u00B7 Production planning and scheduling<\/div><h2>Single-machine scheduling under a breakdown<\/h2><dl><dt>Context<\/dt><dd>ABC Manufacturing has five urgent customer orders and one machine. Each order has a processing time, a due date and a profit. After the first job is completed, the machine fails and is unavailable for 2 hours.<\/dd><dt>Given<\/dt><dd>Jobs A to E, all available at hour 0. Processing times are fixed and a job cannot be interrupted once started. Data is in the table below.<\/dd><dt>Decision<\/dt><dd>The sequence in which jobs are processed: the full sequence before the failure (Round 1), then the order of the remaining jobs after it (Round 2).<\/dd><dt>Objective<\/dt><dd>Deliver as many orders as possible on time and keep total tardiness low. The tardiness of a job is max(0, completion time minus due date).<\/dd><dt>Challenge<\/dt><dd>The best plan before a disruption may not be the best after it. Rebuild your schedule and justify the change.<\/dd><\/dl><\/div>'+'<div class=\"panel\"><h2>The situation<\/h2><div class=\"story\"><p>You are the Production Manager of ABC Manufacturing. Five urgent orders landed at once, all to be made on <b>one machine<\/b>. Every customer has a different deadline. Deliver on time and the company earns profit and goodwill. Deliver late and it pays.<\/p><p>Then, after your first product is finished, <b>the machine breaks down<\/b>. Decide what to run first, how to reshuffle the rest, and how to ship the most orders with the least delay.<\/p><\/div>'+jobTable()+\n    '<ul class=\"rules\"><li>All jobs arrive at hour 0. One machine, one job at a time.<\/li><li>A job cannot be interrupted once started. Processing times are fixed.<\/li><li>Three rounds: plan, survive the breakdown, then present your decision.<\/li><li>Scores are not shown in the app. The organizers mark every entry and announce the results. Ties go to the faster finisher.<\/li><\/ul>'+\n    '<div class=\"fields\"><label class=\"fld\"><span>Your name<\/span><input type=\"text\" id=\"nm\" maxlength=\"40\" autocomplete=\"name\" value=\"'+esc(S.name)+'\"><\/label><label class=\"fld\"><span>Roll number<\/span><input type=\"text\" id=\"rl\" maxlength=\"30\" autocomplete=\"off\" value=\"'+esc(S.roll)+'\"><\/label><\/div>'+\n    '<button class=\"btn go\" id=\"primary\" data-act=\"start\" disabled>Start the clock<\/button><\/div>';\n}\nfunction planHTML(round){\n  var h='',q=round===1?S.q1:S.q2,first=S.q1[0];\n  if(round===2){\n    var f0=J[first].p;\n    h+='<div class=\"alarm-banner\" role=\"alert\"><h2>Attention managers! Machine down<\/h2><p>Job '+first+' ('+J[first].n+') finished at hour '+f0+', then the machine broke down. Repair takes <b>'+REPAIR+' hours<\/b>, so it runs again at hour '+(f0+REPAIR)+'. Rearrange the remaining four jobs and minimise delay. Due dates do not move.<\/p><\/div>';\n  }\n  var order=round===1?S.q1:[first].concat(S.q2),pre=run(order,round===2);\n  var pool=L.filter(function(j){return round===1?S.q1.indexOf(j)<0:(j!==first&&S.q2.indexOf(j)<0)});\n  var need=round===1?5:4;\n  h+='<div class=\"panel\"><h2>'+(round===1?'Round 1 \u00b7 Production planning':'Round 2 \u00b7 Replan the remaining jobs')+'<\/h2>';\n  h+='<p class=\"muted\">'+(round===1?'Tap jobs in the order you want to make them, then work out each finish time.':'Job '+first+' is already done. Order the other four, then recalculate every finish time including the repair.')+'<\/p>';\n  h+=jobTable();\n  h+='<h3 style=\"margin-top:14px\">Jobs available<\/h3><div class=\"pool\">'+(pool.length?pool.map(function(j){return jobCard(j,false)}).join(''):'<div class=\"empty\">All jobs are in the queue.<\/div>')+'<\/div>';\n  h+='<h3>'+(round===1?'Production queue':'New queue after repair')+'<\/h3>'+queueHTML(q,round===1?1:2);\n  h+=gantt(pre.rows,{reveal:false,repair:round===2,done0:round===2});\n  if(q.length){h+='<div class=\"row\" style=\"margin-bottom:10px\"><button class=\"btn sm\" data-act=\"clear\">Clear queue<\/button><\/div>'}\n  if(q.length===need){\n    h+=finInputs(q,round===1?S.f1:S.f2,round===1?'Add up the processing times in your order. At what hour does each job finish?':'Start from the hour the machine is back after repair. At what hour does each remaining job finish?');\n  }\n  if(round===2){h+='<label class=\"fld\"><span>Why did you change your schedule?<\/span><textarea id=\"why\" maxlength=\"300\" placeholder=\"Explain your reasoning in a couple of sentences\">'+esc(S.why)+'<\/textarea><\/label>'}\n  h+='<div class=\"row\" style=\"margin-top:14px\"><button class=\"btn go\" id=\"primary\" data-act=\"lock\" disabled>Lock '+(round===1?'Round 1 plan':'Round 2 plan')+'<\/button><span class=\"err\" id=\"hint\"><\/span><\/div><\/div>';\n  return h;\n}\nfunction resultHTML(round){\n  var res=(round===1?S.s1:S.s2).res,h='';\n  h+='<div class=\"panel\"><h2>Round '+round+' result<\/h2>'+gantt(res.rows,{reveal:true,repair:round===2});\n  h+='<div class=\"tw\"><table><thead><tr><th>Job<\/th><th class=\"m\">Finishes<\/th><th class=\"m\">Due<\/th><th>Status<\/th><\/tr><\/thead><tbody>';\n  res.rows.forEach(function(r){\n    h+='<tr><td><b class=\"j\">'+r.j+'<\/b>'+J[r.j].n+'<\/td><td class=\"m\">'+r.f+'<\/td><td class=\"m\">'+J[r.j].d+'<\/td><td>'+(r.late?'<span class=\"stat-late\">Late '+r.late+' h<\/span>':'<span class=\"stat-ok\">On time<\/span>')+'<\/td><\/tr>';\n  });\n  h+='<\/tbody><\/table><\/div><p class=\"muted\" style=\"margin:12px 0\">Round '+round+' is locked in. Scores are announced by the organizers.<\/p>';\n  h+='<button class=\"btn go\" id=\"primary\" data-act=\"next\">'+(round===1?'Continue':'Go to Round 3')+'<\/button><\/div>';\n  return h;\n}\nfunction r3HTML(){\n  var s2=S.s2,order=[S.q1[0]].concat(S.q2);\n  var chips='<div class=\"chips\"><span class=\"chip\">'+order[0]+'<\/span><span class=\"chip fixc\">REPAIR 2h<\/span>'+order.slice(1).map(function(j){return '<span class=\"chip\">'+j+'<\/span>'}).join('')+'<\/div>';\n  return '<div class=\"panel\"><h2>Round 3 \u00b7 Manager\u2019s final decision<\/h2><p class=\" ents:none}\n.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.btn{background:var(--surface);border:1.5px solid var(--ink);border-radius:2px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:15px}\n.btn:hover{background:var(--surface-2)}\n.btn:disabled{opacity:.6;cursor:default}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n.result{background:var(--surface-2);border-left:6px solid var(--good);padding:12px 14px;margin-top:14px;border-radius:2px}\n.result b{font-family:var(--font-mono)}\n.sheet{display:grid;gap:14px;min-width:0}\n@media (min-width:600px) and (max-width:900px){.sheet{grid-template-columns:1fr 1fr;align-items:start}}\n.clues{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px;min-width:0}\nh2{font:700 20px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}\n.clues ol{list-style:none;margin:0;padding:0;max-height:none}\n@media (min-width:901px){.clues ol{max-height:260px;overflow-y:auto}}\n.clues li{display:grid;grid-template-columns:2.2ch minmax(0,1fr);gap:4px 10px;padding:8px 8px;border-top:1px solid var(--line);cursor:pointer;line-height:1.35;font-size:15px}\n.clues li:hover{background:var(--surface-2)}\n.clues li .cn{font:600 13px var(--font-mono);color:var(--accent);padding-top:1px}\n.clues li .cp{color:var(--ink-2);font:500 12px var(--font-mono);white-space:nowrap}\n.clues li.on{background:var(--word);box-shadow:inset 4px 0 0 var(--accent)}\n.clues li.solved .ct{color:var(--ink-2)}\n.clues li.solved .cn::after{content:\"\\2713\";margin-left:2px;color:var(--good)}\n.help{color:var(--ink-2);font-size:14px;margin:14px 0 0;max-width:62ch}\nbody{margin:0}\n:root{color-scheme:light dark}\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n  <h1>Supply Chain Crossword<\/h1>\n  <p class=\"sub\">Riddle clues from inventory and lean operations. Type each answer without spaces. Numbers in brackets give the word lengths.<\/p>\n  <div class=\"stats\">\n    <div class=\"stat\"><span>Time<\/span><b id=\"sTime\">00:00<\/b><\/div>\n    <div class=\"stat\"><span>Filled<\/span><b id=\"sFilled\">0/0<\/b><\/div>\n  <\/div>\n  <div class=\"bar\" aria-hidden=\"true\"><i id=\"pBar\"><\/i><\/div>\n  <div class=\"stage\">\n    <div>\n      <div class=\"cluebar\">\n        <button id=\"prevW\" aria-label=\"Previous clue\">&#8249;<\/button>\n        <div class=\"txt\" aria-live=\"polite\"><div class=\"tag\" id=\"cbTag\"><\/div><p id=\"cbText\"><\/p><\/div>\n        <button id=\"nextW\" aria-label=\"Next clue\">&#8250;<\/button>\n      <\/div>\n      <div class=\"boardwrap\" id=\"bw\">\n        <div class=\"board\" id=\"board\" role=\"group\" aria-label=\"Crossword grid\"><\/div>\n        <input id=\"kb\" type=\"text\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" inputmode=\"text\" aria-label=\"Type letters for the selected clue\">\n      <\/div>\n      <div class=\"tools\">\n        <button class=\"btn primary\" id=\"bSubmit\">Submit<\/button>\n      <\/div>\n      <div class=\"result\" id=\"done\" role=\"status\" hidden><\/div>\n      <p class=\"help\">Tap a cell, then type. Tap it again to switch between across and down. Arrow keys move, Space switches direction, Tab jumps to the next clue, Backspace deletes. Press Submit when you are done; you can submit at any time, even if some words are still empty. Answers are checked only after you submit.<\/p>\n    <\/div>\n    <div class=\"sheet\">\n      <section class=\"clues\"><h2>Across<\/h2><ol id=\"clAcross\"><\/ol><\/section>\n      <section class=\"clues\"><h2>Down<\/h2><ol id=\"clDown\"><\/ol><\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nvar $=function(s){return document.querySelector(s)};\nvar esc=function(s){return String(s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})};\n\nvar ROWS=15,COLS=14;\nvar W=[\n  {a:'REORDERPOINT',r:3,c:1,d:'A',pat:'7,5',cl:'I decide when stock has fallen far enough that a replenishment order must be triggered. What am I?'},\n  {a:'SAFETYSTOCK',r:0,c:2,d:'D',pat:'6,5',cl:'I am the extra buffer held to absorb surprises in demand or supply. What am I?'},\n  {a:'ABCANALYSIS',r:9,c:0,d:'A',pat:'3,8',cl:'I divide inventory into A, B and C classes according to annual consumption value. What am I?'},\n  {a:'PULLSYSTEM',r:3,c:8,d:'D',pat:'4,6',cl:'I allow production to continue only when downstream demand or a replenishment signal authorizes it. What am I?'},\n  {a:'BOTTLENECK',r:5,c:6,d:'D',pat:'10',cl:'I am the slowest step in a process, so the whole line moves at my pace. What am I?'},\n  {a:'KANBAN',r:5,c:0,d:'D',pat:'6',cl:'I am a card or visual signal that tells the upstream step to make or move more. What am I?'},\n  {a:'LEADTIME',r:1,c:0,d:'A',pat:'4,4',cl:'I am the wait between placing an order and having the goods in hand. What am I?'},\n  {a:'BULLWHIP',r:5,c:6,d:'A',pat:'8',cl:'Small swings in customer demand grow larger as they travel upstream. I am the ___ effect. What am I?'},\n  {a:'TAKTTIME',r:0,c:12,d:'D',pat:'4,4',cl:'I am available production time divided by customer demand, the beat of the line. What am I?'},\n  {a:'EOQ',r:11,c:8,d:'A',pat:'3',cl:'I help determine an order quantity by balancing ordering costs against inventory holding costs. What am I?'},\n  {a:'KAIZEN',r:14,c:6,d:'A',pat:'6',cl:'I am the Japanese word for continuous improvement in small steps. What am I?'},\n  {a:'FIFO',r:0,c:9,d:'D',pat:'4',cl:'By my rule, the oldest stock leaves first. What am I?'}\n];\n\n/* ---------- build solution grid ---------- */\nvar sol=[],cw=[],numAt=[],r,c;\nfor(r=0;r<ROWS;r++){sol.push([]);cw.push([]);numAt.push([]);for(c=0;c<COLS;c++){sol[r].push(null);cw[r].push(null);numAt[r].push(0)}}\nW.forEach(function(w,i){\n  w.cells=[];\n  for(var k=0;k<w.a.length;k++){\n    var rr=w.d==='A'?w.r:w.r+k,cc=w.d==='A'?w.c+k:w.c;\n    if(sol[rr][cc]!==null&&sol[rr][cc]!==w.a.charAt(k))console.error('grid conflict',w.a,rr,cc);\n    sol[rr][cc]=w.a.charAt(k);\n    if(!cw[rr][cc])cw[rr][cc]={A:-1,D:-1};\n    cw[rr][cc][w.d]=i;\n    w.cells.push([rr,cc]);\n  }\n});\nvar starts={};\nW.forEach(function(w){var k=w.r+','+w.c;(starts[k]=starts[k]||[]).push(w)});\nvar num=0;\nfor(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){var s=starts[r+','+c];if(s){num++;numAt[r][c]=num;s.forEach(function(w){w.num=num})}}\nvar order=[];\n['A','D'].forEach(function(d){\n  W.map(function(w,i){return i}).filter(function(i){return W[i].d===d}).sort(function(a,b){return W[a].num-W[b].num}).forEach(function(i){order.push(i)});\n});\nfunction wordAt(r,c,d){var x=cw[r][c];return x?x[d]:-1}\n\n/* ---------- state ---------- */\nvar KEY='supply-chain-crossword-v2';\nfunction blank2(v){var a=[];for(var i=0;i<ROWS;i++){a.push([]);for(var j=0;j<COLS;j++)a[i].push(v)}return a}\nfunction fresh(){return {letters:blank2(''),elapsed:0,submitted:false}}\nvar S=fresh();\ntry{\n  var sv=JSON.parse(localStorage.getItem(KEY));\n  if(sv&&sv.letters&&sv.letters.length===ROWS&&sv.letters[0].length===COLS){\n    S.letters=sv.letters.map(function(row){return row.map(function(x){return typeof x==='string'&&/^[A-Z]?$/.test(x)?x:''})});\n    S.elapsed=+sv.elapsed||0;S.submitted=!!sv.submitted;\n  }\n}catch(e){}\nS.status=blank2('');\nif(S.submitted)markAll();\nS.dir='A';S.r=W[order[0]].r;S.c=W[order[0]].c;\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify({letters:S.letters,elapsed:S.elapsed,submitted:S.submitted}))}catch(e){}}\n\n/* ---------- build DOM ---------- */\nvar board=$('#board'),cells=blank2(null),kb=$('#kb');\nboard.style.setProperty('--cols',COLS);\nfor(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){\n  var el=document.createElement('div');\n  el.className='cell'+(sol[r][c]===null?' blank':'');\n  el.dataset.r=r;el.dataset.c=c;\n  if(sol[r][c]!==null){el.innerHTML=(numAt[r][c]?'<span class=\"n\">'+numAt[r][c]+'<\/span>':'')+'<span class=\"l\"><\/span>';cells[r][c]=el}\n  board.appendChild(el);\n}\nvar clueEls=[];\nfunction buildClues(id,d){\n  var ol=$(id),h='';\n  order.filter(function(i){return W[i].d===d}).forEach(function(i){\n    h+='<li data-w=\"'+i+'\"><span class=\"cn\">'+W[i].num+'<\/span><span><span class=\"ct\">'+esc(W[i].cl)+'<\/span> <span class=\"cp\">('+W[i].pat+')<\/span><\/span><\/li>';\n  });\n  ol.innerHTML=h;\n  $$(ol).forEach(function(li){clueEls[+li.dataset.w]=li});\n}\nfunction $$(ol){return Array.prototype.slice.call(ol.querySelectorAll('li'))}\nbuildClues('#clAcross','A');buildClues('#clDown','D');\n\n/* ---------- logic ---------- */\nfunction cur(){return W[wordAt(S.r,S.c,S.dir)]}\nfunction setSel(r,c,dir){\n  S.r=r;S.c=c;\n  if(wordAt(r,c,dir)>=0)S.dir=dir;else S.dir=dir==='A'?'D':'A';\n  paint();\n}\nfunction selectWord(i){\n  var w=W[i],t=w.cells[0];\n  for(var k=0;k<w.cells.length;k++){if(S.letters[w.cells[k][0]][w.cells[k][1]]===''){t=w.cells[k];break}}\n  S.dir=w.d;S.r=t[0];S.c=t[1];paint();\n}\nfunction toggleDir(){var o=S.dir==='A'?'D':'A';if(wordAt(S.r,S.c,o)>=0){S.dir=o;paint()}}\nfunction jumpWord(delta){\n  var pos=order.indexOf(wordAt(S.r,S.c,S.dir));\n  selectWord(order[(pos+delta+order.length)%order.length]);\n}\nfunction stepInWord(delta){\n  var w=cur(),idx=-1;\n  for(var k=0;k<w.cells.length;k++)if(w.cells[k][0]===S.r&&w.cells[k][1]===S.c)idx=k;\n  var n=idx+delta;\n  if(n>=0&&n<w.cells.length){S.r=w.cells[n][0];S.c=w.cells[n][1];return true}\n  return false;\n}\nfunction startClock(){if(!clock.running){clock.running=true;clock.last=Date.now()}}\nfunction typeLetter(ch){\n  if(S.submitted)return;\n  ch=ch.toUpperCase();\n  if(!/^[A-Z]$/.test(ch))return;\n  startClock();\n  S.letters[S.r][S.c]=ch;\n  stepInWord(1);\n  afterChange();\n}\nfunction backspace(){\n  if(S.submitted)return;\n  startClock();\n  if(S.letters[S.r][S.c]!=='')S.letters[S.r][S.c]='';\n  else if(stepInWord(-1))S.letters[S.r][S.c]='';\n  afterChange();\n}\nfunction clearCell(){\n  if(S.submitted)return;\n  S.letters[S.r][S.c]='';\n  afterChange();\n}\nfunction arrow(k){\n  var dr=0,dc=0,ax='A';\n  if(k==='ArrowLeft'){dc=-1}else if(k==='ArrowRight'){dc=1}else if(k==='ArrowUp'){dr=-1;ax='D'}else{dr=1;ax='D'}\n  if(S.dir!==ax&&wordAt(S.r,S.c,ax)>=0){S.dir=ax;paint();return}\n  var r=S.r+dr,c=S.c+dc;\n  while(r>=0&&r<ROWS&&c>=0&&c<COLS){\n    if(sol[r][c]!==null){setSel(r,c,S.dir);return}\n    r+=dr;c+=dc;\n  }\n}\nfunction solvedCount(){\n  var n=0;\n  W.forEach(function(w){\n    w.solved=w.cells.every(function(p){return S.letters[p[0]][p[1]]===sol[p[0]][p[1]]});\n    if(w.solved)n++;\n  });\n  return n;\n}\nfunction afterChange(){save();paint()}\nfunction markAll(){\n  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){\n    var v=S.letters[r][c];\n    S.status[r][c]=(sol[r][c]!==null&&v!=='')?(v===sol[r][c]?'good':'bad'):'';\n  }\n}\nfunction submitGame(){\n  if(S.submitted)return;\n  S.submitted=true;\n  markAll();\n  clock.running=false;\n  save();paint();\n  try{kb.blur()}catch(e){}\n  var d=$('#done');if(d&&d.scrollIntoView)d.scrollIntoView({block:'nearest',behavior:'smooth'});\n}\n\n/* ---------- paint ---------- */\nfunction fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}\nfunction paint(){\n  var aw=cur(),inw={},k,r,c;\n  aw.cells.forEach(function(p){inw[p[0]*100+p[1]]=1});\n  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){\n    var el=cells[r][c];if(!el)continue;\n    var st=S.status[r][c],cl='cell';\n    if(inw[r*100+c])cl+=' inword';\n    if(st)cl+=' '+st;\n    if(r===S.r&&c===S.c)cl+=' sel';\n    if(el.className!==cl)el.className=cl;\n    var l=el.lastChild;if(l.textContent!==S.letters[r][c])l.textContent=S.letters[r][c];\n  }\n  var n=solvedCount(),act=wordAt(S.r,S.c,S.dir),filled=0,total=0;\n  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){if(sol[r][c]!==null){total++;if(S.letters[r][c]!=='')filled++}}\n  W.forEach(function(w,i){var li=clueEls[i];li.className=(i===act?'on':'')+(S.submitted&&w.solved?' solved':'')});\n  var li=clueEls[act],ol=li.parentNode;\n  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight){ol.scrollTop=Math.max(0,li.offsetTop-ol.clientHeight/2)}\n  $('#cbTag').textContent=aw.num+' '+(aw.d==='A'?'Across':'Down')+' \u00b7 ('+aw.pat+')';\n  $('#cbText').textContent=aw.cl;\n  $('#sFilled').textContent=filled+'/'+total;\n  $('#pBar').style.width=(filled/total*100)+'%';\n  $('#sTime').textContent=fmt(S.elapsed);\n  var d=$('#done');\n  var bs=$('#bSubmit');\n  if(S.submitted){\n    var lc=0;\n    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){if(sol[r][c]!==null&&S.letters[r][c]===sol[r][c])lc++}\n    d.hidden=false;\n    d.innerHTML='Game submitted in <b>'+fmt(S.elapsed)+'<\/b>. Words correct: <b>'+n+'/'+W.length+'<\/b>. Letters correct: <b>'+lc+'/'+total+'<\/b>.';\n    bs.disabled=true;bs.textContent='Submitted';\n  } else {d.hidden=true;bs.disabled=false;bs.textContent='Submit'}\n}\n\n/* ---------- clock ---------- */\nvar clock={running:false,last:0};\nsetInterval(function(){\n  var now=Date.now();\n  if(clock.running&&!S.submitted&&!document.hidden){S.elapsed+=now-clock.last;$('#sTime').textContent=fmt(S.elapsed)}\n  clock.last=now;\n},500);\ndocument.addEventListener('visibilitychange',function(){if(document.hidden)save()});\n\n/* ---------- input ---------- */\nfunction resetKb(){kb.value='.';try{kb.setSelectionRange(1,1)}catch(e){}}\nfunction focusKb(){try{kb.focus({preventScroll:true})}catch(e){}resetKb()}\nboard.addEventListener('click',function(e){\n  var el=e.target.closest('.cell');\n  if(!el||el.classList.contains('blank'))return;\n  var r=+el.dataset.r,c=+el.dataset.c;\n  if(r===S.r&&c===S.c)toggleDir();else setSel(r,c,S.dir);\n  focusKb();\n});\n['#clAcross','#clDown'].forEach(function(id){\n  $(id).addEventListener('click',function(e){\n    var li=e.target.closest('li');if(!li)return;\n    selectWord(+li.dataset.w);focusKb();\n  });\n});\n$('#prevW').addEventListener('click',function(){jumpWord(-1);focusKb()});\n$('#nextW').addEventListener('click',function(){jumpWord(1);focusKb()});\nkb.addEventListener('keydown',function(e){\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  var k=e.key;\n  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();arrow(k)}\n  else if(k==='Tab'){e.preventDefault();jumpWord(e.shiftKey?-1:1)}\n  else if(k==='Enter'){e.preventDefault();jumpWord(1)}\n  else if(k===' '){e.preventDefault();toggleDir()}\n  else if(k==='Backspace'){e.preventDefault();backspace();resetKb()}\n  else if(k==='Delete'){e.preventDefault();clearCell()}\n});\nkb.addEventListener('input',function(){\n  var v=kb.value;\n  if(v.length===0)backspace();\n  else if(v.length>1)typeLetter(v.charAt(v.length-1));\n  resetKb();\n});\nresetKb();\n\n/* ---------- tools ---------- */\n$('#bSubmit').addEventListener('click',submitGame);\n\npaint();\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"};
